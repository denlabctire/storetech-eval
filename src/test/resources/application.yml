spring:
  application.name: storetech.evaluation

  datasource:
    url: jdbc:h2:mem:testdb;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  liquibase:
    change-log: classpath:db.changelog/db.changelog-master.xml
jobs:
  purge:
    cutoff-default: 24 # hours
    cutoff-reward-eligible: 336 #14 days
    cron: "0 */5 * * * *" # Every 5 minutes
